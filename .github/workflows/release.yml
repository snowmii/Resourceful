name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  matrix:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Read Minecraft versions from settings.gradle.kts
        id: read
        run: |
          versions=$(sed -n 's/.*versions(\(.*\)).*/\1/p' settings.gradle.kts \
            | tr -d '" ' | tr ',' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Resolved: $versions"

  build:
    name: Build ${{ matrix.minecraft }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        minecraft: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew ":${{ matrix.minecraft }}:build" --stacktrace

      - name: Collect jars
        run: |
          mkdir -p dist
          find "versions/${{ matrix.minecraft }}/build/libs" -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-sources-dev.jar' \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls -A dist)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resourceful-${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Build changelog from commits
        id: changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..$TAG"
            echo "Previous tag: $prev"
          else
            range="$TAG"
            echo "No previous tag, using full history"
          fi

          # sha|author-name|author-email|subject (subject last: may contain '|')
          # drop bot commits (author name/email), then drop duplicate subjects
          commits=$(git log --no-merges --pretty=format:'%h|%an|%ae|%s' "$range" | awk -F'|' '
            NF < 4 { next }
            {
              sha = $1
              who = tolower($2 " " $3)
              subject = $4
              for (i = 5; i <= NF; i++) subject = subject "|" $i
              if (who ~ /\[bot\]/) next
              if (who ~ /(^|[^a-z])(dependabot|renovate|github-actions|actions-user|codefactor|imgbot|allcontributors|pre-commit(-ci)?|snyk|mergify|weblate|crowdin|semantic-release|release-please)([^a-z]|$)/) next
              if (who ~ /(noreply@github\.com|users\.noreply\.github\.com)$/ && who ~ /bot/) next
              key = tolower(subject)
              if (seen[key]++) next
              print subject "\t" sha
            }
          ')

          body=''

          section() { # $1 = type regex, $2 = heading
            matched=$(printf '%s\n' "$commits" | grep -E "^($1)(\([^)]*\))?!?: " || true)
            [ -z "$matched" ] && return
            body="$body### $2"$'\n\n'
            while IFS=$'\t' read -r subject sha; do
              body="$body- ${subject#*: } ($sha)"$'\n'
            done <<< "$matched"
            body="$body"$'\n'
          }

          section 'feat|feature' 'Features'
          section 'fix|bugfix'    'Bug Fixes'
          section 'perf'          'Performance'
          section 'refactor'      'Refactoring'
          section 'docs'          'Documentation'
          section 'test'          'Tests'
          section 'build|ci'      'Build & CI'
          section 'style|chore'   'Chores'

          other=$(printf '%s\n' "$commits" \
            | grep -vE '^(feat|feature|fix|bugfix|perf|refactor|docs|test|build|ci|style|chore)(\([^)]*\))?!?: ' || true)
          if [ -n "$other" ]; then
            body="$body### Other"$'\n\n'
            while IFS=$'\t' read -r subject sha; do
              body="$body- $subject ($sha)"$'\n'
            done <<< "$other"
            body="$body"$'\n'
          fi

          if [ -n "$prev" ]; then
            body="$body**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"$'\n'
          fi

          printf '%s' "$body"
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s' "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download all jars
        uses: actions/download-artifact@v8
        with:
          pattern: resourceful-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          fail_on_unmatched_files: true

  modrinth:
    name: Modrinth ${{ matrix.minecraft }}
    needs: [ matrix, build, github-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        minecraft: ${{ fromJson(needs.matrix.outputs.versions) }}
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Download jar
        if: env.MODRINTH_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: resourceful-${{ matrix.minecraft }}
          path: dist

      - name: Fetch release notes
        if: env.MODRINTH_TOKEN != ''
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<CHANGELOG_EOF'
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/*.jar
          name: Resourceful ${{ env.TAG }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ steps.notes.outputs.version }}+${{ matrix.minecraft }}
          changelog: ${{ steps.notes.outputs.body }}
          loaders: fabric
          game-versions: ${{ matrix.minecraft }}
          java: 25
          dependencies: |
            fabric-api(required)
